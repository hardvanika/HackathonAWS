AWSTemplateFormatVersion: '2010-09-09'
Description: Rol que GitHub Actions (solo la rama main de este repo) asume para desplegar el hackathon. Se lanza una vez desde el portátil.
Parameters:
  Repo:
    Type: String
    Default: hardvanika/HackathonAWS
  CreateProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Pon false si la cuenta ya tiene el proveedor OIDC de token.actions.githubusercontent.com.
Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, 'true']
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-hackathon
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repo}:ref:refs/heads/main
      # El stack crea roles IAM, Lambda, Cognito, CloudFront, S3, DynamoDB y API Gateway,
      # así que el rol necesita permisos amplios. Solo lo puede usar un push a main de este repo.
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
